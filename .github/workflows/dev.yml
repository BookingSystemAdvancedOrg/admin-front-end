name: Dev CI/CD

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: dev-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cicd:
    uses: ./.github/workflows/reusable_cicd.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
