name: Dev CI/CD

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: dev-cicd-${{ github.ref }}
  # Deploys (push) always finish - a half-synced bucket is worse than a
  # queued run. Superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cicd:
    uses: ./.github/workflows/reusable_cicd.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
